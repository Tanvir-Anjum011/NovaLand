<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVALAND</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="hud-layer">
    <header class="w-full flex items-center justify-between">
      <div class="hud-interactive">
        <span class="brand-title text-base md:text-xl font-extrabold tracking-[0.28em]">
          NOVALAND
        </span>
      </div>

      <div class="hud-interactive">
        <button id="sound-btn" class="day-glass-card hover:bg-white/70 transition-all duration-300 px-4 min-h-[40px] rounded-full flex items-center justify-center gap-2 text-xs text-sky-950 font-medium">
          <svg id="sound-icon" class="w-3.5 h-3.5 text-sky-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
          <span id="sound-label" class="text-[11px] tracking-wider uppercase font-semibold">Sound</span>
        </button>
      </div>
    </header>
  </div>

  <script src="script.js"></script>

</body>
</html>
